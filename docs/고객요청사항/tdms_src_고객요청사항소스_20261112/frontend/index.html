<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TDMS 기술자료 관리 시스템</title>
  <link rel="icon" href="assets/favicon.ico?v=1" />
  <link rel="stylesheet" href="style.css?v=36" />
  <link rel="stylesheet" href="tree.css?v=10" />
  <link rel="stylesheet" href="distribute.css?v=8" />
  <script src="auth-guard.js?v=13"></script>
</head>
<body id="tdb-search-page">
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="index.html">
        <img class="app-brand-logo" src="assets/skgas-logo.png" alt="SK gas" />
        <span class="app-brand-text"><strong>TDMS</strong> 기술자료 관리 시스템</span>
      </a>
      <nav class="app-nav">
        <a href="index.html" class="active">TDB 조회</a>
        <a href="import.html">TDB 반입·검수</a>
        <a href="editor.html">TDB 관리</a>
        <a href="distributions.html">TDB 반출이력</a>
        <a href="mdb.html">MDB 조회</a>
        <a href="mdb-editor.html">MDB 관리</a>
        <a href="audit.html">시스템 로그</a>
        <a href="users.html">사용자 관리</a>
      </nav>
      <div id="user-slot" class="app-user"></div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title"><a class="page-title-link" href="index.html">TDB 조회</a><span class="page-title-sub">Technical Data Book(도면·기술자료) 문서 조회 및 열람</span></h1>
      </div>
      <div class="page-actions">
        <button id="retired-open-btn" type="button">폐기 보관함 <span id="retired-count" class="tree-count"></span></button>
      </div>
    </div>

    <!-- 폴더 계층은 좌측 트리가 담당하고, 여기는 검색 + 성격 조건. 한 줄에 배치. -->
    <div class="filter-bar">
      <div class="filter-row">
       <div class="filter-fields">
        <div class="field">
          <label for="kind_scope">검색대상</label>
          <select id="kind_scope">
            <option value="FOLDER">폴더명</option>
            <option value="FILE" selected>자료명</option>
            <option value="SHORTCUT_PID">P&amp;ID</option>
            <option value="SHORTCUT_PDF">PFD</option>
          </select>
        </div>

        <div class="field">
          <label for="status">상태</label>
          <select id="status">
            <option value="">전체</option>
            <option value="ACTIVE">정상</option>
            <option value="CHECKED_OUT">반출</option>
            <option value="IN_CART">반출대기</option>
            <option value="REVIEW">검수</option>
          </select>
        </div>

        <div class="field">
          <label for="holding">원본/사본</label>
          <select id="holding">
            <option value="">전체</option>
            <option value="BOTH">원본/사본 있음</option>
            <option value="ORIGINAL_ONLY">원본만 있음</option>
            <option value="COPY_ONLY">사본만 있음</option>
          </select>
        </div>

        <div class="field">
          <label for="modified-toggle">수정일</label>
          <div class="hideable-dropdown ms-dropdown" id="modified-dropdown">
            <button type="button" class="dropdown-toggle" id="modified-toggle">전체</button>
            <div class="dropdown-list hidden" id="modified-list"></div>
          </div>
        </div>

        <div class="field">
          <label for="iso-toggle">Isometric 보기</label>
          <div class="hideable-dropdown ms-dropdown" id="iso-dropdown">
            <button type="button" class="dropdown-toggle" id="iso-toggle">선택 안 함</button>
            <div class="dropdown-list hidden" id="iso-list"></div>
          </div>
        </div>

        <label class="check-inline field-check">
          <input type="checkbox" id="recursive_folder" /> 하위폴더 전체보기
        </label>

        <input type="text" id="q" class="filter-search" placeholder="자료명 검색" />
        <button id="search-btn" class="primary">검색</button>
       </div>

        <div class="filter-actions">
          <button id="reset-btn" type="button">조건 초기화</button>
        </div>
      </div>
    </div>

    <div class="main-layout">
      <aside class="tree-panel">
        <div class="tree-head">
          <b id="tree-collapse-all" title="눌러서 대분류만 보이게 접기">폴더</b>
        </div>
        <div id="folder-tree"></div>
      </aside>

      <div id="tree-resize-handle" class="tree-resize-handle"></div>

      <div class="main-content">
        <div class="status-bar">
          <span class="status-bar-left">
            <span id="selected-folder-name" class="selected-folder-name"></span>
            <span id="total-count"></span>
            <button id="clear-selection-btn" class="clear-selection-btn" type="button" title="체크해둔 자료를 모두 해제합니다" hidden>선택 초기화</button>
          </span>
          <span class="cart-status">
            <button id="add-folder-to-cart-btn" class="cart-btn" type="button">폴더 반출</button>
            <button id="add-to-cart-btn" class="cart-btn">선택 반출</button>
            <button id="cart-open-btn" class="cart-btn" type="button">반출대기함 (<span id="cart-count">0</span>)</button>
            <button id="export-btn" class="cart-btn" type="button">엑셀 내보내기</button>
          </span>
        </div>

        <div class="table-scroll">
          <table id="doc-table">
            <colgroup>
              <col style="width:54px" />
              <col style="width:34px" />
              <col style="width:220px" />
              <col style="width:100px" />
              <col />
              <col style="width:50px" />
              <col style="width:92px" />
              <col style="width:58px" />
              <col style="width:58px" />
              <col style="width:58px" />
              <col style="width:58px" />
              <col style="width:134px" />
            </colgroup>
            <!-- data-sort-key: 이 열 이름으로 서버에 정렬을 맡긴다(화면의 50건이 아니라
                 조회 결과 전체가 정렬 대상이므로). data-sort="off"는 정렬 대상에서 제외. -->
            <thead>
              <tr>
                <th data-sort="off">No</th>
                <th class="col-check"><input type="checkbox" id="select-all" /></th>
                <th data-sort-key="drawing_no">자료명</th>
                <th data-sort-key="category">분류</th>
                <th data-sort-key="path">경로</th>
                <th data-sort-key="rev">Rev</th>
                <th data-sort-key="status">상태</th>
                <th data-sort-key="dwg">DWG</th>
                <th data-sort-key="xlsx">XLSX</th>
                <th data-sort-key="etc">ETC</th>
                <th data-sort-key="pdf">PDF</th>
                <th data-sort-key="updated_at">최종수정</th>
              </tr>
            </thead>
            <tbody id="doc-tbody"></tbody>
          </table>
        </div>

        <div class="pagination">
          <span class="nav-btn-pair">
            <button id="first-page" class="nav-step-btn" title="맨 처음 페이지"><span class="nav-arrow dbl-arrow">◀◀</span> 처음</button>
            <button id="prev-page" class="nav-step-btn" title="이전 페이지"><span class="nav-arrow">◀</span> 이전</button>
          </span>
          <span id="page-pos-box" class="page-pos-box">
            <input type="text" inputmode="numeric" id="page-pos-input" class="nav-pos-input" title="페이지 번호를 입력하고 Enter" />
            <span>/ <span id="page-total"></span> 페이지</span>
          </span>
          <span class="nav-btn-pair">
            <button id="next-page" class="nav-step-btn" title="다음 페이지">다음 <span class="nav-arrow">▶</span></button>
            <button id="last-page" class="nav-step-btn" title="맨 끝 페이지">끝 <span class="nav-arrow dbl-arrow">▶▶</span></button>
          </span>
        </div>
      </div>
    </div>
  </main>

  <!-- 반출하기 -->
  <div id="distribute-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="dist-head">
        <h2>반출하기</h2>
        <!-- 끄면 폴더 경로 없이 자료와 엑셀 목록이 Zip 바로 밑에 평평하게 담긴다.
             수정용은 업체가 받은 폴더 구조 그대로 돌려줘야 하므로 켠 채로 잠긴다(2026-08-28 CM 확정). -->
        <label class="dist-keep-paths" id="dist-keep-paths-label"><input type="checkbox" id="dist-keep-paths" checked /> 폴더 경로 유지</label>
      </div>

      <div class="modal-box-label">공사</div>
      <div class="dist-daterange-row">
        <input type="date" id="dist-project-date-from" title="공사 등록일(시작)" />
        <span class="dist-daterange-sep">~</span>
        <input type="date" id="dist-project-date-to" title="공사 등록일(종료)" />
      </div>
      <div class="hideable-dropdown" id="dist-project-dropdown">
        <button type="button" class="dropdown-toggle">선택</button>
        <div class="dropdown-list hidden"></div>
      </div>
      <div class="inline-add">
        <input type="text" id="new-project-name" placeholder="새 공사명" />
        <button id="add-project-btn" type="button">＋추가</button>
      </div>

      <div class="modal-box-label">업체</div>
      <div class="hideable-dropdown" id="dist-vendor-dropdown">
        <button type="button" class="dropdown-toggle">선택</button>
        <div class="dropdown-list hidden"></div>
      </div>
      <div class="inline-add">
        <input type="text" id="new-vendor-name" placeholder="새 업체명" />
        <button id="add-vendor-btn" type="button">＋추가</button>
      </div>

      <div class="modal-box-label">반출 목적</div>
      <fieldset class="purpose-row">
        <label data-perm="screen.tdb_list.distribute.modify"><input type="radio" name="purpose" value="MODIFY" checked /> 수정용</label>
        <label><input type="radio" name="purpose" value="REFERENCE" /> 참조용</label>
        <label><input type="radio" name="purpose" value="OTHER" /> 기타</label>
      </fieldset>
      <textarea id="purpose-other-note" placeholder="필요 시 사유를 입력해주세요"></textarea>

      <div id="distribute-warning" class="warning-box hidden"></div>

      <div class="modal-actions">
        <button id="distribute-cancel-btn" type="button">취소</button>
        <button id="distribute-submit-btn" class="primary" type="button">반출 실행</button>
      </div>
    </div>
  </div>

  <!-- 반출대기함 -->
  <div id="cart-modal" class="modal-overlay hidden">
    <div class="modal-box cart-box">
      <div class="cart-head">
        <h2>반출대기함</h2>
        <span class="cart-head-actions">
          <button id="cart-export-btn" class="small" type="button">엑셀 내보내기</button>
        </span>
      </div>
      <div class="table-scroll cart-list">
        <table id="cart-table">
          <colgroup>
            <col style="width:54px" />
            <col style="width:34px" />
            <col style="width:280px" />
            <col style="width:150px" />
            <col />
            <col style="width:80px" />
          </colgroup>
          <thead><tr><th>No</th><th class="col-check"><input type="checkbox" id="cart-select-all" /></th><th>자료명</th><th>분류</th><th>경로</th><th>상태</th></tr></thead>
          <tbody id="cart-tbody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button id="cart-close-btn" type="button">닫기</button>
        <button id="cart-save-btn" type="button">저장</button>
        <button id="cart-delete-btn" type="button">삭제</button>
        <button id="cart-distribute-btn" class="primary" type="button">이 목록으로 반출하기</button>
      </div>
    </div>
  </div>

  <!-- 반출대기함 수정사항 저장 확인 (네이티브 confirm 대신 자체 대화상자) -->
  <div id="unsaved-dialog" class="modal-overlay hidden">
    <div class="modal-box confirm-box">
      <p>변경사항이 있습니다. 저장하고 닫으시겠습니까?</p>
      <div class="modal-actions">
        <button id="unsaved-cancel-btn" type="button">취소</button>
        <button id="unsaved-discard-btn" type="button">저장 안 함</button>
        <button id="unsaved-save-btn" class="primary" type="button">저장하고 닫기</button>
      </div>
    </div>
  </div>

  <!-- 자료명 옆 돋보기 아이콘 → PDF만 크게 보여주는 미리보기 팝업(다른 섹션 없음, 이전/다음 이동 가능)은
       ui.js가 화면에 공용으로 하나만 만들어 붙인다. -->

  <script src="ui.js?v=41"></script>
  <script src="favorites.js?v=9"></script>
  <script src="script.js?v=19"></script>
</body>
</html>
