<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TDMS 기술자료 관리 시스템</title>
  <link rel="icon" href="assets/favicon.ico?v=1" />
  <link rel="stylesheet" href="style.css?v=36" />
  <script src="auth-guard.js?v=13"></script>
</head>
<body id="distributions-page">
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="index.html">
        <img class="app-brand-logo" src="assets/skgas-logo.png" alt="SK gas" />
        <span class="app-brand-text"><strong>TDMS</strong> 기술자료 관리 시스템</span>
      </a>
      <nav class="app-nav">
        <a href="index.html">TDB 조회</a>
        <a href="import.html">TDB 반입·검수</a>
        <a href="editor.html">TDB 관리</a>
        <a href="distributions.html" class="active">TDB 반출이력</a>
        <a href="mdb.html">MDB 조회</a>
        <a href="mdb-editor.html">MDB 관리</a>
        <a href="audit.html">시스템 로그</a>
        <a href="users.html">사용자 관리</a>
        <a href="backup.html">백업 관리</a>
      </nav>
      <div id="user-slot" class="app-user"></div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title"><a class="page-title-link" href="distributions.html">TDB 반출이력</a><span class="page-title-sub">TDB 자료 다운로드 및 반출 기록 관리</span></h1>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-row">
        <div class="filter-fields">
          <div class="field">
            <label for="project">공사</label>
            <select id="project"><option value="">전체</option></select>
          </div>
          <div class="field">
            <label for="vendor">업체</label>
            <select id="vendor"><option value="">전체</option></select>
          </div>
          <div class="field">
            <label for="from">기간</label>
            <input type="date" id="from" />
          </div>
          <div class="field">
            <label for="to">~</label>
            <input type="date" id="to" />
          </div>
          <div class="field">
            <label for="purpose">반출목적</label>
            <select id="purpose">
              <option value="">전체</option>
              <option value="MODIFY">수정용</option>
              <option value="REFERENCE">참조용</option>
              <option value="OTHER">기타</option>
            </select>
          </div>
          <div class="field">
            <label for="status">반출상태</label>
            <select id="status">
              <option value="">전체</option>
              <option value="REVIEWING">검수대기</option>
              <option value="ISSUE">확인필요</option>
              <option value="DONE">반입완료</option>
              <option value="INCOMPLETE">반입미완료</option>
            </select>
          </div>
          <div class="field">
            <label for="export-kind">반출형태</label>
            <select id="export-kind">
              <option value="FILE" selected>자료</option>
              <option value="ZIP">Zip</option>
            </select>
          </div>
          <div class="field">
            <label for="dist-by-toggle">반출자</label>
            <div class="hideable-dropdown" id="dist-by-dropdown">
              <button type="button" class="dropdown-toggle" id="dist-by-toggle">전체</button>
              <div class="dropdown-list hidden" id="dist-by-list"></div>
            </div>
          </div>
          <input type="text" id="q" class="filter-search" placeholder="자료명 검색" />
          <button id="search-btn" class="primary">검색</button>
        </div>
        <div class="filter-actions">
          <button id="reset-btn" type="button">조건 초기화</button>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="total-count"></span>
      <span class="cart-status">
        <button id="bulk-return-btn" class="cart-btn" type="button">선택 반납처리</button>
        <button id="export-btn" class="cart-btn" type="button">엑셀 내보내기</button>
      </span>
    </div>

    <div class="table-scroll">
      <table id="dist-table">
        <colgroup>
          <col style="width:54px" />
          <col style="width:34px" />
          <col style="width:210px" />
          <col style="width:110px" />
          <col style="width:110px" />
          <col style="width:88px" />
          <col style="width:70px" />
          <col style="width:130px" />
          <col style="width:130px" />
          <col style="width:120px" />
          <col style="width:230px" />
          <col style="width:100px" />
          <col style="width:180px" />
        </colgroup>
        <thead>
          <tr>
            <th>No</th><th class="col-check"><input type="checkbox" id="dist-select-all" /></th>
            <th>자료명</th><th>공사</th><th>업체</th><th>목적</th>
            <th>반출Rev</th><th>반출일시</th><th>반입일시</th><th>상태</th>
            <th>확인</th><th>반출자</th><th>비고</th>
          </tr>
        </thead>
        <tbody id="dist-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 자료명 옆 돋보기 아이콘 → PDF 미리보기 팝업은 ui.js가 화면에 공용으로 하나만 만들어 붙인다. -->

  <script src="ui.js?v=40"></script>
  <script src="favorites.js?v=9"></script>
  <script src="distributions.js?v=13"></script>
</body>
</html>
