# 파이썬 보안 검사 도구(bandit) 설정 — security_check.py가 이 파일을 읽어 bandit을 돌린다 (D-111).
# 사람이 bandit을 직접 돌릴 일은 없다. 검사는 항상 아래 명령 하나로 한다:
#     backend> venv\Scripts\python.exe security_check.py

# 검사하지 않는 폴더 — 남이 만든 부품(venv)과 자동으로 생기는 캐시
exclude_dirs:
  - venv
  - __pycache__

# 이 프로젝트에서 일부러 끈 검사 항목과 그 이유
skips:
  # B404: "subprocess를 import했다"는 것만으로 알리는 항목. 이 시스템은 DWG·오피스 미리보기 변환과
  #       백업(pg_dump) 때문에 외부 프로그램을 반드시 불러야 한다. 위험한 부르는 방식(shell=True,
  #       B602)은 따로 계속 검사하므로 import 자체는 알릴 필요가 없다.
  - B404
  # B603: shell 없이 목록 인자로 외부 프로그램을 부른 곳마다 "확인해 보라"고 알리는 항목. 목록 인자는
  #       글자를 이어 붙인 명령이 아니라서 사용자가 적은 값이 명령으로 해석될 수 없다 — 이 프로젝트의
  #       표준 방식이다(CLAUDE.md 보안 규칙). 그래서 끄고, 대신 shell=True(B602)는 반드시 막는다.
  - B603
