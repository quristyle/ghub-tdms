# .mjs 의 MIME 타입. nginx 기본 mime.types 에는 js 만 있고 mjs 가 없어서
# default_type(application/octet-stream) 으로 떨어진다. 브라우저는 모듈
# 스크립트에 엄격한 MIME 검사를 하므로 <script type="module"> 이 통째로 거부된다
#   Failed to load module script: Expected a JavaScript-or-Wasm module script
#      but the server responded with a MIME type of "application/octet-stream"
# PDF.js 뷰어가 pdf.mjs·viewer.mjs 를 모듈로 올리기 때문에 미리보기가 빈 화면이 된다.
#
# **http 컨텍스트에 두어야 한다.** nginx 의 types 는 같은 레벨에서는 합쳐지지만
# 아래 레벨에서 다시 선언하면 윗 맵을 통째로 **대체한다** — server 블록 안에 넣으면
# css·json·wasm 까지 octet-stream 이 된다(실제로 확인했다).
# conf.d/*.conf 는 nginx.conf 의 http 블록에서 include 되므로 여기가 그 자리다.

types {
    text/javascript mjs;
}
