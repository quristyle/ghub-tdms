# 정적·HTML 응답에 붙는 보안 헤더. location 마다 include 한다.
#
# nginx 의 add_header 는 **자기 add_header 를 가진 location 에서 상속이 끊긴다.**
# server 블록에 한 번만 적으면 Cache-Control 을 붙이는 location 들에서 통째로
# 사라진다 — 실제로 운영에서 SPA 응답에 보안 헤더가 하나도 없었다.
# 그래서 파일로 빼서 쓰는 자리마다 include 한다.

add_header X-Content-Type-Options nosniff always;

# SAMEORIGIN 이어야 한다. DENY 는 **같은 출처 iframe 도 막는다** —
# 자료 상세의 미리보기 탭이 /pdfjs/web/viewer.html 을 iframe 으로 띄우므로
# DENY 로 두면 그 탭이 빈 화면이 된다(PdfViewer.vue).
add_header X-Frame-Options SAMEORIGIN always;

add_header Referrer-Policy same-origin always;
