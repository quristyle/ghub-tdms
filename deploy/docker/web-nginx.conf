# 웹 컨테이너 안의 nginx. 바깥 nginx(호스트)는 TLS 만 벗기고 여기로 넘긴다.
#
# 여기가 하는 일 셋
#   1. SPA 정적 파일 서빙
#   2. /api/ → api 컨테이너 (앞의 /api 는 떼고 넘긴다 — 앱 라우트는 /auth/me 처럼 맨몸이다)
#   3. /_blob/ 내부 직송 — 앱이 권한 검사·감사 기록만 하고 X-Accel-Redirect 로 넘긴다

upstream tdms_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # 도면 원본·데이터북 묶음이 올라온다. 레거시의 '업로드 무제한' 문제를 여기서 막는다.
    client_max_body_size 2g;
    client_body_temp_path /tmp/tdms-upload;

    root /srv/tdms/web;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 보안 헤더는 **location 마다 include 한다.** nginx 의 add_header 는
    # 자기 add_header 를 가진 location 에서 상속이 끊긴다 — server 블록에만
    # 적어 두면 /assets/·/pdfjs/·/ 처럼 Cache-Control 을 붙이는 자리에서
    # 통째로 사라진다. 실제로 운영에서 SPA 응답에 하나도 붙어 있지 않았다.
    # (/api/ 는 앱이 직접 붙인다 — 여기서 또 붙이면 두 번 나간다.)

    # 컨테이너 자신이 살아 있는지 — HEALTHCHECK 가 본다. api 까지 보지는 않는다
    # (api 가 잠깐 죽어도 화면은 떠야 "서버 응답 없음" 을 사용자에게 보여줄 수 있다).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 파일명에 해시가 박혀 있다 — 영구 캐시해도 안전하다.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF.js 뷰어(이식본). 버전 고정이라 중간 캐시로 충분하다.
    location /pdfjs/ {
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://tdms_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 작업 진행률은 SSE 다 — 버퍼링하면 막대가 끝날 때 한 번에 튄다.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id      $request_id;

        # api 컨테이너에 닿지 못하면 기본 502 HTML 대신 ErrorResponse 모양의 JSON 을 낸다.
        # 화면(api.ts)이 그 message 를 그대로 띄운다. 앱이 직접 낸 오류는 건드리지 않는다
        # (proxy_intercept_errors 는 꺼져 있다 — nginx 가 스스로 만든 오류만 잡힌다).
        error_page 502 503 504 =503 @api_down;
    }

    location @api_down {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"서버가 잠시 응답하지 않습니다. 잠시 후 다시 시도해 주세요."}';
    }

    # 앱은 바이트를 만지지 않는다. 권한을 확인한 뒤 이 경로를 가리키면
    # 커널 sendfile 이 내보낸다. internal → 바깥에서 직접 부를 수 없다.
    location /_blob/ {
        internal;
        alias /srv/tdms/blobs/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        output_buffers 4 256k;
    }
}
