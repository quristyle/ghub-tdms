# /etc/nginx/sites-available/tdms
# 설계문서 07-운영배포.md 참조

upstream tdms_api { server unix:/run/tdms/api.sock; }

server {
    listen 80;
    server_name tdms.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tdms.example.internal;

    ssl_certificate     /etc/tdms/tls/fullchain.pem;
    ssl_certificate_key /etc/tdms/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근 제한을 여기로 올린다 — 앱 미들웨어는 프록시 뒤에서 무력화된다(기존 S-08)
    include /etc/nginx/tdms-allow.conf;    # allow 10.0.0.0/8;  deny all;
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  10.0.0.0/8;

    client_max_body_size 2g;               # 업로드 무제한 문제 해소
    client_body_temp_path /srv/tdms/tmp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 해시 파일명이라 영구 캐시
    location /assets/ {
        root /srv/tdms/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /srv/tdms/web;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://tdms_api/;
        proxy_http_version 1.1;
        proxy_buffering off;               # SSE 진행률
        proxy_read_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
    }

    # 파일 직송 — 앱은 권한 검사와 감사 기록만 하고 여기로 넘긴다
    location /_blob/ {
        internal;
        alias /srv/tdms/blobs/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        output_buffers 4 256k;
    }
}
