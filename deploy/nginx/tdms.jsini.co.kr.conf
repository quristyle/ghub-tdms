# 정본은 이 파일이다. 서버의 /etc/nginx/sites-available/ 로 복사해서 쓴다.
#   sudo cp deploy/nginx/tdms.jsini.co.kr.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/tdms.jsini.co.kr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 블록이 하는 일은 **TLS 를 벗기고 넘기는 것뿐**이다. 화면·API 프록시·파일 직송은
# 전부 웹 컨테이너 안의 nginx 가 한다(deploy/docker/web-nginx.conf).
# 그래서 배포가 바뀌어도 이 파일은 거의 손대지 않는다 — sudo 가 필요한 자리를 줄였다.
#
# 하나 더 — 웹 컨테이너에 닿지 못하면(배포 중 재시작·다운) 기본 "502 Bad Gateway"
# 대신 점검 화면을 낸다. 화면 파일은 컨테이너 밖에 있어야 한다(컨테이너가 죽었으니까):
#   sudo mkdir -p /var/www/tdms-down
#   sudo cp deploy/nginx/tdms-down/* /var/www/tdms-down/

# 점검 응답 고르기. /api/ 호출은 JSON 으로 — 화면의 api.ts 가 ErrorResponse 로 읽어
# "요청에 실패했습니다 (502)" 대신 사람 말로 된 message 를 띄운다.
# map 은 http 문맥이라 server 밖에 둔다. 이름에 tdms_ 를 붙여 다른 사이트와 안 겹치게.
map $request_uri $tdms_down_page {
    ~^/api/  /_tdms_down/api.json;
    default  /_tdms_down/index.html;
}

server {
    # HTTP/2 는 켜지 않는다. 이 서버의 nginx 는 1.24 라 독립 지시어가 없고
    # (1.25.1 에 들어왔다), 1.24 식으로 listen 줄에 붙이면 같은 443 소켓을 쓰는
    # 다른 12개 사이트와 listen 옵션이 어긋나 duplicate 로 막힌다.
    # 기존 사이트 중 쓰는 곳도 없다 — 집안 관례에 맞춘다.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tdms.jsini.co.kr;

    ssl_certificate     /etc/letsencrypt/live/tdms.jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdms.jsini.co.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 도면 원본·데이터북 묶음. 안쪽 nginx 에도 같은 값이 있다 — **둘 다** 올려야 한다.
    client_max_body_size 2g;

    access_log /var/log/nginx/tdms.access.log;
    error_log  /var/log/nginx/tdms.error.log;

    # nginx 가 **스스로 만든** 502/503/504(연결 거부·시간 초과)만 잡는다.
    # proxy_intercept_errors 는 끈 채로 둔다 — 앱이 일부러 낸 503 등은 그대로 통과한다.
    # 503 + Retry-After 로 바꿔 내보낸다: "잠깐 쉬는 중" 이 502 보다 뜻이 맞다.
    error_page 502 503 504 =503 $tdms_down_page;

    location ^~ /_tdms_down/ {
        internal;
        alias /var/www/tdms-down/;
        # add_header 가 있는 location 은 server 의 add_header 를 물려받지 않는다 — HSTS 다시.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
        charset utf-8;
        charset_types application/json;
    }

    location / {
        proxy_pass http://127.0.0.1:5570;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 작업 진행률이 SSE 다. 버퍼링하면 막대가 끝에서 한 번에 튄다.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tdms.jsini.co.kr;
    return 301 https://$host$request_uri;
}
