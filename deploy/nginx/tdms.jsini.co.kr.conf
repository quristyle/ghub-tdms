# 정본은 이 파일이다. 서버의 /etc/nginx/sites-available/ 로 복사해서 쓴다.
#   sudo cp deploy/nginx/tdms.jsini.co.kr.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/tdms.jsini.co.kr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 블록이 하는 일은 **TLS 를 벗기고 넘기는 것뿐**이다. 화면·API 프록시·파일 직송은
# 전부 웹 컨테이너 안의 nginx 가 한다(deploy/docker/web-nginx.conf).
# 그래서 배포가 바뀌어도 이 파일은 거의 손대지 않는다 — sudo 가 필요한 자리를 줄였다.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tdms.jsini.co.kr;

    ssl_certificate     /etc/letsencrypt/live/tdms.jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdms.jsini.co.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 도면 원본·데이터북 묶음. 안쪽 nginx 에도 같은 값이 있다 — **둘 다** 올려야 한다.
    client_max_body_size 2g;

    access_log /var/log/nginx/tdms.access.log;
    error_log  /var/log/nginx/tdms.error.log;

    location / {
        proxy_pass http://127.0.0.1:5570;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 작업 진행률이 SSE 다. 버퍼링하면 막대가 끝에서 한 번에 튄다.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tdms.jsini.co.kr;
    return 301 https://$host$request_uri;
}
